              h('tbody',{}, items.map(p=>{
                const st=this.statusOf(p);
                return h('tr',{key:p.id},
                  h('td',{style:{padding:'13px 14px',fontSize:12.5,color:C.txSb,fontFamily:this.bf(),borderBottom:`1px solid ${C.border}`}},p.sku),
                  h('td',{style:{padding:'13px 14px',fontSize:13.5,fontWeight:700,color:C.txDk,fontFamily:this.bf(),borderBottom:`1px solid ${C.border}`}},p.name),
                  h('td',{style:{padding:'13px 14px',fontSize:13.5,color:C.txDk,textAlign:'right',fontFamily:this.bf(),borderBottom:`1px solid ${C.border}`}},p.qty),
                  h('td',{style:{padding:'13px 14px',fontSize:13,color:C.txSb,textAlign:'right',fontFamily:this.bf(),borderBottom:`1px solid ${C.border}`}},p.reorderPoint),
                  h('td',{style:{padding:'13px 14px',textAlign:'right',borderBottom:`1px solid ${C.border}`}}, this.badge(st.label,st.key)),
                  h('td',{style:{padding:'13px 14px',textAlign:'center',borderBottom:`1px solid ${C.border}`}},
                    this.button('รับเข้า', ()=>{this.setState({stockPid:p.id,stockQty:'1',stockError:'',stockSuccess:''});this.nav('stock-in');}, 'secondary', null, {padding:'7px 16px',fontSize:12.5})));
              }))))
          );
          return this.appShell('สินค้าใกล้หมด', `รายการที่คงเหลือต่ำกว่าหรือเท่ากับจุดสั่งซื้อ (${items.length} รายการ)`, content);
        }

        /* ───────────── TRANSACTIONS ───────────── */
        exportCsv(){
          const rows = [['วันที่','ประเภท','SKU','ชื่อสินค้า','จำนวน','หมายเหตุ']];
          const nameOf = pid => (this.state.products.find(p=>p.id===pid)||{}).name || '';
          const skuOf = pid => (this.state.products.find(p=>p.id===pid)||{}).sku || '';
          this.state.transactions.forEach(t=> rows.push([t.time, t.type==='IN'?'รับเข้า':'เบิกจ่าย', skuOf(t.pid), nameOf(t.pid), (t.type==='IN'?'':'-')+t.qty, t.note]));
          const csv = rows.map(r=>r.map(c=>'"'+String(c).replace(/"/g,'""')+'"').join(',')).join('\r\n');
          const blob = new Blob(['\uFEFF'+csv], {type:'text/csv;charset=utf-8;'});
          const url = URL.createObjectURL(blob);
          const a = document.createElement('a'); a.href=url; a.download='genius-stock-transactions.csv'; document.body.appendChild(a); a.click(); document.body.removeChild(a);
          URL.revokeObjectURL(url);
        }
        renderTransactions(){
          const h=React.createElement; const C=this.C();
          const nameOf = pid => (this.state.products.find(p=>p.id===pid)||{}).name || '';
          const skuOf = pid => (this.state.products.find(p=>p.id===pid)||{}).sku || '';
          let list = this.state.transactions;
          if (this.state.txFilter!=='ทั้งหมด') list = list.filter(t=> (this.state.txFilter==='รับเข้า'?'IN':'OUT')===t.type);
          const chip=(label)=>h('span',{key:label,onClick:()=>this.setState({txFilter:label}),style:{cursor:'pointer',background:this.state.txFilter===label?C.pri:C.cardBg,color:this.state.txFilter===label?'#fff':C.txMd,border:`1.5px solid ${this.state.txFilter===label?C.pri:C.border}`,borderRadius:20,padding:'6px 14px',fontSize:12.5,fontWeight:this.state.txFilter===label?700:500}},label);
          const content = h('div',{style:{display:'flex',flexDirection:'column',gap:18}},
            h('div',{style:{display:'flex',alignItems:'center',justifyContent:'space-between',flexWrap:'wrap',gap:12}},
              h('div',{style:{display:'flex',gap:8}}, ['ทั้งหมด','รับเข้า','เบิกจ่าย'].map(chip)),
              this.button('Export CSV', ()=>this.exportCsv(), 'secondary', 'download')),
            this.card(h('div',{style:{padding:'8px 6px',overflowX:'auto'}},
              h('table',{style:{width:'100%',borderCollapse:'collapse',minWidth:640}},
                h('thead',{}, h('tr',{}, ['วันที่','ประเภท','สินค้า','จำนวน','หมายเหตุ',''].map((th,i)=>h('th',{key:i,style:{textAlign:i===3?'right':(i===5?'center':'left'),fontSize:11.5,color:C.txSb,fontWeight:600,padding:'10px 14px',borderBottom:`1px solid ${C.border}`}},th)))),
                h('tbody',{}, list.map(t=>h('tr',{key:t.id},
                  h('td',{style:{padding:'13px 14px',fontSize:12.5,color:C.txSb,fontFamily:this.bf(),borderBottom:`1px solid ${C.border}`}},t.time),
                  h('td',{style:{padding:'13px 14px',borderBottom:`1px solid ${C.border}`}}, this.badge(t.type==='IN'?'รับเข้า':'เบิกจ่าย', t.type==='IN'?'ok':'low')),
                  h('td',{style:{padding:'13px 14px',borderBottom:`1px solid ${C.border}`}}, h('div',{style:{fontSize:13.5,fontWeight:700,color:C.txDk,fontFamily:this.bf()}},nameOf(t.pid)), h('div',{style:{fontSize:11,color:C.txSb}},skuOf(t.pid))),
                  h('td',{style:{padding:'13px 14px',fontSize:14,fontWeight:700,color:t.type==='IN'?C.aGr:C.amb,textAlign:'right'}}, (t.type==='IN'?'+':'-')+t.qty),
                  h('td',{style:{padding:'13px 14px',fontSize:12.5,color:C.txMd,fontFamily:this.bf(),borderBottom:`1px solid ${C.border}`}},t.note),
                  h('td',{style:{padding:'13px 14px',textAlign:'center',borderBottom:`1px solid ${C.border}`}},
                    h('button',{onClick:()=>{ if(window.confirm('ลบรายการนี้และคืนยอดสต็อก?')) this.setState(s=>({ transactions:s.transactions.filter(x=>x.id!==t.id), products:s.products.map(p=>p.id===t.pid?{...p,qty: t.type==='IN'? p.qty-t.qty : p.qty+t.qty}:p) })); }, style:{background:C.lBg,border:'none',borderRadius:9,width:30,height:30,cursor:'pointer',display:'flex',alignItems:'center',justifyContent:'center'}}, this.ic('trash',14,C.lRd,2))))))))
            ));
          return this.appShell('ประวัติการเคลื่อนไหว', list.length+' รายการ', content);
        }

        renderVals(){
          const C = this.C();
          const p = this.state.page;
          let tree;
          if (p==='login') tree = this.renderLogin();
          else if (p==='register') tree = this.renderRegister();
          else if (p==='forgot') tree = this.renderForgot();
          else if (p==='products') tree = this.renderProducts();
          else if (p==='product-new' || p==='product-edit') tree = this.renderProductForm();
          else if (p==='stock-in') tree = this.renderStockForm(true);
          else if (p==='stock-out') tree = this.renderStockForm(false);
          else if (p==='low-stock') tree = this.renderLowStock();
          else if (p==='transactions') tree = this.renderTransactions();
          else tree = this.renderDashboard();
          return {
            rootStyle: {minHeight:'100vh', width:'100%', background:C.pageBg, fontFamily:"'Inter','Anuphan',sans-serif", color:C.txDk},
            appTree: tree,
          };
        }
      }
    </script>
  </body>
</html>
