name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: stockuser
          POSTGRES_PASSWORD: stockpass
          POSTGRES_DB: stockdb
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U stockuser -d stockdb"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://stockuser:stockpass@localhost:5432/stockdb?schema=public
      BETTER_AUTH_SECRET: ci-test-secret-do-not-use-in-production-0000

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # pnpm-workspace.yaml has no `packages:` list (it only holds allowBuilds),
      # which makes `pnpm exec`/`pnpm run <script>` for these two fail with
      # "packages field missing or empty" — call the binaries directly instead.
      - name: Generate Prisma client
        run: ./node_modules/.bin/prisma generate

      - name: Apply migrations
        run: ./node_modules/.bin/prisma migrate deploy

      - name: Type check
        run: pnpm run typecheck

      - name: Run tests
        run: pnpm test

  build-and-push:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Normalizes ghcr.io/<owner>/<repo> to lowercase (GHCR rejects uppercase)
      # and derives tags (branch, sha, latest) automatically.
      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=sha,prefix=,format=long
            type=raw,value=latest

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
